<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${person.name()})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar('people')}"></div>
<main class="main-content">
    <header class="page-header">
        <div>
            <a href="/people" class="back-link">← Back to People</a>
            <h1 th:text="${person.name()}">Person</h1>
            <p class="subtitle" th:text="${person.bio()}">Bio</p>
        </div>
    </header>

    <section class="detail-section">
        <h2>Skills</h2>
        <div th:if="${#lists.isEmpty(skills)}" class="empty-state compact">
            <p>No skills recorded for this person.</p>
        </div>
        <div th:unless="${#lists.isEmpty(skills)}" class="skill-chips">
            <div class="skill-chip" th:each="s : ${skills}">
                <span class="chip-name" th:text="${s.skillName()}">Java</span>
                <span class="chip-meta" th:text="${s.proficiency()} + ' · ' + ${s.years()} + 'y'">advanced</span>
            </div>
        </div>
    </section>

    <section class="detail-section">
        <h2>Skill Gap Analysis</h2>
        <p class="section-desc">Select a target role to see what skills this person still needs.</p>
        <div class="form-row">
            <select id="gapRoleSelect" class="select-input">
                <option value="">Choose a role…</option>
                <option th:each="role : ${roles}" th:value="${role.id()}" th:text="${role.title()}">Role</option>
            </select>
            <button id="gapAnalyzeBtn" class="btn btn-primary" th:attr="data-person-id=${person.id()}">Analyze Gap</button>
        </div>
        <div id="gapResults" class="results-panel hidden"></div>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
